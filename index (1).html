<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشفرات الخاصة 2025</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            text-align: center;
            color: white;
            margin: 0;
            padding: 0;
        }
        .header {
            font-size: 32px;
            font-family: 'Amiri', serif;
            margin-top: 30px;
        }
        .subtitle {
            font-size: 22px;
            margin-top: 10px;
        }
        .login-box {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 30px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        input[type="email"], input[type="password"] {
            padding: 12px;
            margin: 10px;
            width: 250px;
            border-radius: 8px;
            border: none;
        }
        button {
            padding: 12px 24px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .hidden {
            display: none;
        }
        .table-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        table {
            width: 80%;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        }
        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: white;
        }
        th {
            background-color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
        }
        td {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
        .welcome-message {
            font-size: 24px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loginSection">
        <div class="header">بسم الله الرحمن الرحيم</div>
        <div class="subtitle">شفرات خاصة</div>

        <div class="login-box">
            <form id="loginForm" onsubmit="checkLogin(event)">
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
                <br>
                <input type="password" id="password" placeholder="كلمة المرور" required>
                <br>
                <button type="submit">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <div id="codesSection" class="hidden">
        <div class="header">قائمة شفرات رقم (1) لعام 2025</div>
        <div id="welcomeMessage" class="welcome-message"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم الشفرة</th>
                        <th>معناها</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>كريبتون</td>
                        <td>واحد حلو</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>حمض الطرطريك</td>
                        <td>عبودي ❤️</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>نبي ندير تفاعل</td>
                        <td>تاعب على هذا</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>نعليا من تكافؤك</td>
                        <td>نعليا من جسمك الحلو</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="footer">© 2025 - des:obeee515</div>
    </div>

    <script>
        function checkLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const loginSection = document.getElementById('loginSection');
            const codesSection = document.getElementById('codesSection');
            const welcomeMessage = document.getElementById('welcomeMessage');
            
            // الحصول على الوقت الحالي
            const currentHour = new Date().getHours();
            let greeting = '';
            if (currentHour < 12) {
                greeting = 'صباح الخير';
            } else if (currentHour < 18) {
                greeting = 'نهارك سعيد';
            } else {
                greeting = 'مساء الخير';
            }
            
            // الحصول على تاريخ اليوم
            const today = new Date().toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            if (email === 'Ggg515@gmail.com' && password === 'obeee515') {
                const message = `اهلا بالزعيم ☠️\n${greeting}\nتاريخ اليوم: ${today}`;
                alert(message);  // عرض الرسالة المنبثقة
                loginSection.classList.add('hidden');
                codesSection.classList.remove('hidden');
            } else if (email === 'Mmm515@gmail.com' && password === 'masuod515') {
                const message = `نورت يا مسعود 🤍\n${greeting}\nتاريخ اليوم: ${today}`;
                alert(message);  // عرض الرسالة المنبثقة
                loginSection.classList.add('hidden');
                codesSection.classList.remove('hidden');
            } else {
                alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
                window.location.href = 'about:blank'; // يغلق الصفحة
            }
        }
    </script>

</body>
</html>
